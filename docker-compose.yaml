services:
  vaultwarden:
    image: "vaultwarden/server:latest"
    container_name: "vaultwardenfinallversion"
    restart: unless-stopped
    env_file:
     - conf_env_for_vaultwarden_finall_version.env
    environment:
      ADMIN_TOKEN: "HASLO"  
    volumes:
      - ./vw-data/:/data/
      - ./vw-data/template/email:/data/templates/email
    ports:
      - "801:80"
    networks:
      vaultwarden_network:
        ipv4_address: 10.10.10.3

networks:
  vaultwarden_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1