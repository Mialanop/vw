services:
  vaultwarden:
    image: "vaultwarden/server:latest"
    container_name: "vaultwardenfinallversion"
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: "HASLO"
      DOMAIN: "https://pass.martech-it.org"
      SIGNUPS_ALLOWED: "false"
      SIGNUPS_VERIFY: "true"
      EMERGENCY_ACCESS_ALLOWED: "true"
      INVITATION_ORG_NAME: "Bank haseł"
      SHOW_PASSWORD_HINT: "false"
      SMTP_HOST: "smtp.poczta.onet.pl"
      SMTP_FROM: "passmartech-it@onet.pl"
      SMTP_FROM_NAME: "Bank Haseł"
      SMTP_PORT: 587
      SMTP_SECURITY: "starttls"
      SMTP_USERNAME: "passmartech-it@onet.pl"
      SMTP_PASSWORD: "DDOC-KFDN-PKFG-F2RB"
      SMTP_TIMEOUT: 25
      SMTP_EMBED_IMAGES: "true"
      WEBSOCKET_ENABLED: "true"
      RELOAD_TEMPLATES: "false"
    volumes:
      - ./vw-data/:/data/
    ports:
      - "801:80"
    networks:
      vaultwarden_network:
        ipv4_address: 10.10.10.3

networks:
  vaultwarden_network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.10.0/24
          gateway: 10.10.10.1